<!doctype html>
<html><head><meta charset="utf-8"><title>Pawse gallery</title>
<link rel="stylesheet" href="css/pet.css">
<style>body{margin:0;background:#dfe6ee;font:13px system-ui}.row{display:flex;gap:6px;padding:6px 10px;align-items:flex-end}.cell{position:relative;width:170px;height:150px}.cell span{position:absolute;top:0;left:4px;color:#556}</style></head>
<body><div id="g"></div>
<script type="module">
import { petSVG, COATS, coatVars } from './js/art.js';
const q = new URLSearchParams(location.search);
const acts = (q.get('acts') || 'stand:idle,stand:walk,sit:idle,sit:wave,sleep:idle,stand:stretch').split(',');
let html = '';
for (const sp of Object.keys(COATS)) for (const coat of Object.keys(COATS[sp])) {
  html += '<div class="row">';
  for (const a of acts) {
    const [pose, act] = a.split(':');
    const vars = Object.entries(coatVars(sp, coat)).map(([k, v]) => `${k}:${v}`).join(';');
    html += `<div class="cell"><span>${sp}/${coat} ${a}</span><div class="pet" data-pose="${pose}" data-act="${act}" style="${vars}"><div class="flip">${petSVG(sp)}</div></div></div>`;
  }
  html += '</div>';
}
document.getElementById('g').innerHTML = html;
</script></body></html>
